<!doctype html><html lang="en"><meta charset="utf-8"><title>LP social card renderer — build only</title>
<style>
@font-face{font-family:Poppins;src:url(assets/poppins-700.ttf);font-weight:700;font-display:block}
@font-face{font-family:Montserrat;src:url(assets/montserrat-400.ttf);font-weight:400;font-display:block}
@font-face{font-family:Montserrat;src:url(assets/montserrat-600.ttf);font-weight:600;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#050607;color:white;font-family:Montserrat,sans-serif}.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#050607}.scene{position:absolute;inset:0;width:1200px;height:630px;object-fit:cover;opacity:.9}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#050607 0%,#050607ee 30%,#050607aa 49%,transparent 80%)}.brand{position:absolute;left:80px;top:64px;display:flex;align-items:center;gap:20px}.logo{width:72px;height:72px;object-fit:contain}.brand-name{font-size:17px;font-weight:600;letter-spacing:3px;color:#c6c8cb}.copy{position:absolute;left:80px;top:178px;width:700px}.label{font-size:17px;font-weight:600;letter-spacing:2px;color:#ff9800;margin:0 0 22px}.title{font:700 56px/1.1 Poppins,sans-serif;letter-spacing:-1.8px;margin:0 0 24px}.title span{display:block;white-space:nowrap}.title span:last-child{color:#ff9800}.support{font:400 20px/1.6 Montserrat,sans-serif;color:#bfc2c9;margin:0;max-width:640px}.url{position:absolute;left:80px;bottom:64px;margin:0;font-size:17px;color:#c2c4c9;letter-spacing:.2px}.url:before{content:'';display:inline-block;width:28px;height:2px;background:#ff9800;vertical-align:middle;margin-right:14px}.portrait{position:absolute;right:80px;bottom:72px;width:310px;height:430px;object-fit:contain;object-position:bottom}.home .copy{width:730px}.home .title{font-size:54px}.home .support{max-width:670px;font-size:19px}.about .copy{width:720px}.about .title{font-size:56px}.contact .title{font-size:76px;line-height:1.05}.contact .support{max-width:520px}.contact .cta{margin-top:24px;font-size:20px;color:#ff9800;font-weight:600}.portfolio .copy{width:540px}.portfolio .title{font-size:52px}.portfolio .support{max-width:480px;font-size:19px}.portfolio .products{position:absolute;left:625px;top:180px;width:495px;height:340px}.portfolio .products img{position:absolute;object-fit:contain;filter:drop-shadow(0 12px 24px #0008)}.portfolio .p0{left:0;top:0;width:165px;height:335px}.portfolio .p1{left:175px;top:0;width:320px;height:180px}.portfolio .p2{left:165px;top:180px;width:330px;height:165px}.case .scene{opacity:.24}.case .shade{background:linear-gradient(90deg,#050607 0%,#050607e8 33%,#05060780 58%,#05060744)}.case:after{content:'';position:absolute;right:110px;top:160px;width:390px;height:300px;background:var(--accent);opacity:.13;filter:blur(80px);border-radius:50%;pointer-events:none}.case .copy{width:430px;top:220px;z-index:2}.case .title{font-size:64px}.case .title span:last-child{color:white}.case .support{font-size:22px;max-width:370px}.case .product{position:absolute;left:550px;top:145px;width:570px;height:405px;object-fit:contain;z-index:2;filter:drop-shadow(0 18px 26px #0009)}.case .brand,.case .url{z-index:2}
</style><main class="card" id="card"></main>
<script>
window.renderCard=async function(c){let e=document.querySelector('#card');e.replaceChildren();e.className='card '+c.kind;e.style.setProperty('--accent',c.accent||'#ff9800');let text=(tag,cls,value,parent=e)=>{let n=document.createElement(tag);n.className=cls;n.textContent=value;parent.append(n);return n},img=(cls,path,parent=e)=>{let n=document.createElement('img');n.className=cls;n.src='../../'+path;parent.append(n);return n};img('scene','scripts/social-cards/assets/'+(c.kind==='contact'?'contact':'about')+'-scene.png');text('div','shade','');let brand=text('div','brand','');img('logo','assets/images/logo/white-logo-reeni.png',brand);text('span','brand-name','LAJAPATHY',brand);if(c.kind==='home')img('portrait','lajapathy-hero-new.png');let copy=text('div','copy','');text('p','label',c.label,copy);let h=text('h1','title','',copy);for(let line of c.lines)text('span','',line,h);text('p','support',c.support,copy);if(c.kind==='contact')text('p','cta','Start a conversation',copy);text('p','url',c.url);if(c.product)img('product',c.product);if(c.kind==='portfolio'){let group=text('div','products','');['ewallet','norton','fluxcrm'].forEach((id,i)=>img('p'+i,'assets/images/latest-portfolio/'+id+'-home-product.webp',group))}await document.fonts.ready;await Promise.all([...e.querySelectorAll('img')].map(i=>i.decode()));};
</script></html>
