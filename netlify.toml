# Reviewed Netlify release configuration; secrets are managed in Netlify environment controls.
[build]
  command = "node build-release.mjs"
  publish = "output/stage7-release"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Preserve the existing .html links and canonical URLs; do not rewrite the site.
[build.processing]
  skip_processing = true

[dev]
  framework = "#static"
  publish = "output/stage7-release"
  port = 8893
  autoLaunch = false

[[redirects]]
  from = "/mailer.php"
  to = "/contact.html"
  status = 302
  force = true

[[redirects]]
  from = "/mailchat.php"
  to = "/contact.html"
  status = 302
  force = true

[[redirects]]
  from = "/404.shtml"
  to = "/404.html"
  status = 301
  force = true

[[redirects]]
  from = "/pagenotfound.html"
  to = "/404.html"
  status = 301
  force = true

# Leave real missing paths as 404; no SPA catch-all rewrite.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/Casestudies/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

