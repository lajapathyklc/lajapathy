	document.addEventListener('scroll', function () {
		var scrollTop = window.scrollY || window.pageYOffset;
		var docHeight = document.documentElement.scrollHeight - window.innerHeight;
		var scrollPercent = docHeight > 0 ? (scrollTop / docHeight) : 0;
		// 87% (bottom) when at top, 0% (top) when at bottom
		var translateY = 87 - (87 * scrollPercent);
		var water = document.querySelectorAll('.scrollToTop .water');
		water.forEach(function (w) {
			w.style.transform = 'translate(0px, ' + translateY + '%)';
		});
	});
</script>

<script>
	document.addEventListener("DOMContentLoaded", function () {
		const menuBtn = document.querySelector(".humberger_menu_active");
		const menuIcon = document.getElementById("menuBtn");
		const mobileMenu = document.querySelector(".tmp-popup-mobile-menu");
		const closeBtn = document.querySelector(".close-button");
		const menuLinks = document.querySelectorAll(".tmp-popup-mobile-menu a");

		function openMenu() {
			if (mobileMenu) mobileMenu.classList.add("active");
			if (menuIcon) {
				menuIcon.classList.add("active");
				menuIcon.classList.remove("fa-bars");
				menuIcon.classList.add("fa-xmark");
			}
			document.body.style.overflow = "hidden";
		}

		function closeMenu() {
			if (mobileMenu) mobileMenu.classList.remove("active");
			if (menuIcon) {
				menuIcon.classList.remove("active");
				menuIcon.classList.remove("fa-xmark");
				menuIcon.classList.add("fa-bars");
			}
			document.body.style.overflow = "";
		}

		if (menuBtn) menuBtn.addEventListener("click", openMenu);
		if (closeBtn) closeBtn.addEventListener("click", closeMenu);

		menuLinks.forEach(link => {
			link.addEventListener("click", closeMenu);
		});
	});
</script>

		padding-left: 35px !important;

<script>
	document.addEventListener('DOMContentLoaded', function () {
		if (typeof Swiper !== 'undefined') {
			new Swiper('.logo-swiper', {
				slidesPerView: 5,
				spaceBetween: 30,
				loop: true,
				autoplay: {
					delay: 2000,
					disableOnInteraction: false,
				},
				navigation: {
					nextEl: '.logo-swiper .swiper-button-next',
					prevEl: '.logo-swiper .swiper-button-prev',
				},
				breakpoints: {
					1200: { slidesPerView: 5 },
					992: { slidesPerView: 4 },
					768: { slidesPerView: 3 },
					576: { slidesPerView: 2 },
					0: { slidesPerView: 1 }
				}
			});
		}
	});
	document.addEventListener('DOMContentLoaded', function () {
		// Odometer counter for all elements with class 'odometer'
		if (typeof Odometer !== 'undefined') {
			document.querySelectorAll('.odometer').forEach(function (el) {
				var count = el.getAttribute('data-count');
				el.innerHTML = '00'; // Start from 00
				setTimeout(function () {
					el.innerHTML = count;
				}, 500); // Delay for animation
			});
		}
	});
</script>
